<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><base href="../../"><title>TEST · Menu scrivanie</title>
<link rel="stylesheet" href="assets/css/style.css"><link rel="stylesheet" href="assets/css/ios-foundation.css"><link rel="stylesheet" href="assets/css/order-glass.css">
<style>body{background:#dae6ef;color:#15233c}.test-toolbar{padding:20px;display:flex;gap:8px;flex-wrap:wrap}.test-toolbar button{padding:10px}#test-result{margin:16px;padding:16px;white-space:pre-wrap;background:white;color:#172b44}#gpo-mapping-page{position:fixed;inset:20px;background:white;z-index:100}#processed-container{padding-top:0!important}.order-card{padding:20px;background:#f4f8fc!important;color:#15233c!important;min-height:850px}.card-header{background:transparent!important;color:#15233c!important}.tab-content:not(.active){display:none}.tab-content.active{display:grid}</style>
</head><body class="mg-ios orders-loaded"><div class="test-toolbar" id="tabs-container"><button class="tab-button active" data-tab="orders">Ordini</button><button class="tab-button" data-tab="automatico">Panoramica</button><button class="tab-button" data-tab="processed">E1</button><button class="tab-button" data-tab="processed-e2">E2</button><button class="tab-button" data-tab="processed-e3">E3</button><button class="tab-button" data-tab="processed-e4">E4</button><button id="run-tests">Esegui test navigazione</button></div>
<pre id="test-result" role="status">Dati fittizi. Nessuna connessione a Shopify, listini o database.</pre>
<section id="orders-container" class="tab-content active" data-content="orders">Ordini DEMO</section><section id="automatico-container" class="tab-content" data-content="automatico">Panoramica DEMO</section><section id="processed-container" class="tab-content" data-content="processed"></section><section id="gpo-mapping-page" hidden>Pagina GPO DEMO</section>
<script src="assets/js/order-glass.js"></script><script>
const G=window.MGOrderGlass,c=document.getElementById('processed-container'),result=document.getElementById('test-result');
function fill(tab){const prefix=tab==='processed'?'E1':'E3';c.innerHTML=Array.from({length:18},(_,i)=>`<article class="order-card" data-order-id="${prefix}-${i}" data-glass-profit="10,00 €" data-glass-customer="${i===1?'Nicolò':'Cliente '+i}"><div class="card-header"><h2>#${prefix}-${i}</h2><span class="config-badge">PC DEMO</span></div><p>Dettaglio ${prefix}-${i}</p></article>`).join('');}
function tab(key){document.querySelectorAll('.tab-button').forEach(b=>b.classList.toggle('active',b.dataset.tab===key));document.querySelectorAll('.tab-content').forEach(p=>p.classList.toggle('active',p.dataset.content===(key.startsWith('processed')?'processed':key)));if(key.startsWith('processed'))fill(key);G.sync();}
document.querySelectorAll('.tab-button').forEach(b=>b.onclick=()=>tab(b.dataset.tab));
const tick=()=>new Promise(r=>setTimeout(r,90));
document.getElementById('run-tests').onclick=async()=>{let checks=0;const log=[];const ok=(condition,label)=>{if(!condition)throw Error(label);checks++;log.push('✓ '+label);};const menu=()=>document.getElementById('mg-order-navigation');const input=()=>menu().querySelector('input');const visibleCards=()=>[...c.querySelectorAll('.order-card')].filter(c=>!c.classList.contains('mg-order-inactive'));const choose=id=>[...menu().querySelectorAll('[data-glass-order]')].find(b=>b.dataset.glassOrder===id).click();const search=text=>{input().value=text;input().dispatchEvent(new Event('input'));};try{
 tab('processed');await tick();ok(!menu().hidden,'Menu visibile in E1');choose('E1-1');ok(visibleCards()[0]?.dataset.orderId==='E1-1','Cambio ordine mostra il dettaglio scelto');
 input().focus();search('nicolo');ok(visibleCards().length===1,'Ricerca con accento');ok(G.purchaseScopeCards().length===18,'Riepilogo acquisti comprende tutta la scrivania anche in vista singola e con ricerca');ok(document.activeElement===input(),'Focus ricerca conservato');const originalInput=input();c.querySelector('[data-order-id="E1-1"]').dataset.glassProfit='12,00 €';G.sync();ok(input()===originalInput,'Aggiornamento dati conserva il campo ricerca');ok(document.activeElement===input(),'Aggiornamento dati conserva il focus');
 search('inesistente');ok(visibleCards().length===0 && !c.querySelector('.mg-order-empty').hidden,'Nessun risultato dichiarato senza mostrare un altro cliente');search('');ok(visibleCards()[0]?.dataset.orderId==='E1-1','Cancellando la ricerca ritorna la selezione');
 tab('orders');await tick();ok(menu().hidden,'Menu chiuso passando a Ordini');ok(!document.body.classList.contains('mg-glass-desk'),'Stile scrivania rimosso in Ordini');ok(getComputedStyle(c).display==='none','Scrivania realmente nascosta in Ordini');
 tab('automatico');await tick();ok(menu().hidden,'Menu chiuso in Panoramica');
 tab('processed');await tick();ok(visibleCards()[0]?.dataset.orderId==='E1-1','Ritorno in E1 conserva selezione');search('nicolo');
 tab('processed-e3');await tick();ok(input().value==='' && visibleCards().length===1,'E3 non eredita ricerca E1');choose('E3-3');menu().querySelector('.mg-all-orders').click();ok(visibleCards().length===18,'Tutti gli ordini disponibili');
 tab('processed');await tick();ok(input().value==='nicolo' && visibleCards()[0]?.dataset.orderId==='E1-1','E1 recupera la propria ricerca');ok(visibleCards().length===1,'Tutti gli ordini non si trasferisce fra scrivanie');
 const overlay=document.getElementById('gpo-mapping-page');overlay.hidden=false;await tick();ok(menu().hidden,'Menu sospeso aprendo GPO');overlay.hidden=true;await tick();ok(!menu().hidden,'Menu ripristinato chiudendo GPO');
 search('');menu().scrollTop=100;menu().querySelector('.mg-order-list').scrollLeft=90;await tick();const left=menu().querySelector('.mg-order-list').scrollLeft,top=menu().scrollTop;c.querySelector('[data-order-id="E1-0"]').dataset.glassProfit='15,00 €';G.sync();ok(menu().scrollTop===top,'Aggiornamento conserva scroll verticale');ok(menu().querySelector('.mg-order-list').scrollLeft===left,'Aggiornamento conserva scroll orizzontale');
 choose('E1-1');ok(Math.abs(visibleCards()[0].getBoundingClientRect().top-16)<3,'Cambio ordine riporta all’intestazione');
 tab('processed-e2');await tick();ok(!menu().hidden,'Scrivania E2 accessibile');tab('processed-e4');await tick();ok(!menu().hidden,'Scrivania E4 accessibile');
 tab('orders');fill('processed');await tick();ok(menu().hidden && getComputedStyle(c).display==='none','Risposta tardiva non riapre il menu fuori dalle scrivanie');
 tab('processed');await tick();let mutations=0;const observer=new MutationObserver(rs=>mutations+=rs.length);observer.observe(c,{attributes:true,subtree:true});await tick();await tick();observer.disconnect();ok(mutations===0,'Nessun ciclo continuo di modifiche DOM a riposo');
 result.textContent='PASS '+checks+' controlli\n'+log.join('\n');document.title='PASS · '+checks+' test menu';result.scrollIntoView();
 }catch(e){result.textContent='FAIL dopo '+checks+' controlli: '+e.message+'\n'+log.join('\n');document.title='FAIL · Test menu';result.scrollIntoView();throw e;}};
</script></body></html>
